name: Notify Engine CI

on:

  push:

  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test
        env: 
          SESSION_SECRET: notify-engine-secret
          DATABASE_URL: postgres://test
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: password