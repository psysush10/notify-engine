<!DOCTYPE html>
<html>

<head>

  <title>Import Wizard</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 30px;
    }

    #dropZone {

      border: 2px dashed #999;
      border-radius: 10px;

      padding: 50px;

      text-align: center;

      cursor: pointer;

      margin-bottom: 20px;

      transition: 0.2s;

    }

    #dropZone:hover {

      background: #f5f5f5;

    }

    .status {

      border: 1px solid #ddd;

      border-radius: 8px;

      padding: 15px;

      margin-top: 15px;

    }

    button {

      padding: 10px 20px;

      cursor: pointer;

      border: none;

      border-radius: 5px;

    }

    .primary {

      background: #1f6feb;

      color: white;

    }

    .success {

      background: #198754;

      color: white;

    }

    table {

  width: 100%;

  border-collapse: collapse;

}

th,
td {

  border: 1px solid #ddd;

  padding: 10px;

}

th {

  background: #f5f5f5;

}

  </style>

</head>

<body>

  <h1>CSV Import Wizard</h1>

  <div id="dropZone">

    <strong>Drop CSV Here</strong>

    <br><br>

    or

    <br><br>

    Click To Select

    <input
      type="file"
      id="csvFile"
      hidden
    />

  </div>

  <div id="filePreview"></div>

  <br>

  <button
    class="primary"
    onclick="uploadFile()"
  >
    Upload CSV
  </button>

  <div id="uploadResult"></div>

  <div id="processSection"></div>

  <div id="statusSection"></div>

  <script>

    const API_KEY =
      "ntf_0d3d0a4e77c4879b";

    let currentJobId = null;
    let pollingInterval = null;

    const dropZone =
      document.getElementById(
        "dropZone"
      );

    const fileInput =
      document.getElementById(
        "csvFile"
      );

    dropZone.onclick =
      () => {

        fileInput.click();

      };

    dropZone.addEventListener(
      "dragover",
      (event) => {

        event.preventDefault();

      }
    );

    dropZone.addEventListener(
      "drop",
      (event) => {

        event.preventDefault();

        fileInput.files =
          event.dataTransfer.files;

        previewFile();

      }
    );

    fileInput.addEventListener(
      "change",
      previewFile
    );

    function previewFile() {

      const file =
        fileInput.files[0];

      if (!file) {

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        (event) => {

          const rows =
            event.target.result
              .split("\n")
              .length - 1;

          document
            .getElementById(
              "filePreview"
            )
            .innerHTML =

            `
            <div class="status">

              <strong>File Selected</strong>

              <br><br>

              File Name:
              ${file.name}

              <br>

              File Size:
              ${(file.size / 1024).toFixed(2)} KB

              <br>

              Estimated Rows:
              ${rows}

            </div>
            `;

        };

      reader.readAsText(
        file
      );

    }

    async function uploadFile() {

      const file =
        fileInput.files[0];

      if (!file) {

        alert(
          "Please select a CSV file."
        );

        return;

      }

      const formData =
        new FormData();

      formData.append(
        "tenantId",
        "org_1782124460039"
      );

      formData.append(
        "jobType",
        "CUSTOMERS"
      );

      formData.append(
        "file",
        file
      );

      const response =
        await fetch(

          "/imports/upload",

          {

            method: "POST",

            headers: {

              Authorization:
                `Bearer ${API_KEY}`

            },

            body:
              formData

          }

        );

      const result =
        await response.json();

      currentJobId =
        result.jobId;

      document
        .getElementById(
          "uploadResult"
        )
        .innerHTML =

        `
        <div class="status">

          <strong>Upload Successful</strong>

          <br><br>

          Job ID:
          ${result.jobId}

          <br>

          Status:
          ${result.status}

        </div>
        `;

      document
        .getElementById(
          "processSection"
        )
        .innerHTML =

        `
        <br>

        <button
          class="success"
          onclick="processImport()"
        >

          Process Import

        </button>
        `;

    }

    async function processImport() {

      const response =
        await fetch(

          `/imports/${currentJobId}/process`,

          {

            method: "POST",

            headers: {

              Authorization:
                `Bearer ${API_KEY}`

            }

          }

        );

      const result = await response.json();
      startPolling();

      document
        .getElementById(
          "statusSection"
        )
        .innerHTML =

        `
        <div class="status">

  <strong>

    Import Processing

  </strong>

  <br><br>

  ${result.message}

  <br><br>

  Status updates automatically.

</div>
        `;

    }

    function startPolling() {

  if (
    pollingInterval
  ) {

    clearInterval(
      pollingInterval
    );

  }

  pollingInterval =
    setInterval(

      async () => {

        await checkStatus();

      },

      2000

    );

}

    async function checkStatus() {

      const response =
        await fetch(

          `/imports/${currentJobId}`,

          {

            headers: {

              Authorization:
                `Bearer ${API_KEY}`

            }

          }

        );

      const result =
        await response.json();

        if(result.status === "COMPLETED"){
            clearInterval(pollingInterval);
        }

        if(result.status === "FAILED"){
            clearInterval(pollingInterval);
        }

    const errorResponse = await fetch(`/imports/${currentJobId}/errors`,
        {
            headers: {
                Authorization: `Bearer ${API_KEY}`
            }
        }
    );

    const errors = await errorResponse.json();

    const errorHtml =

  errors.length === 0

    ? "<p>No validation errors</p>"

    : errors
        .map(

          error =>

            `
            <tr>

              <td>
                ${error.row_number}
              </td>

              <td>
                ${error.error_message}
              </td>

            </tr>
            `

        )
        .join("");

      document
        .getElementById(
          "statusSection"
        )
        .innerHTML =

        `
            <div class="status">

  <strong>
    Import Status
  </strong>

  <br><br>

Current Status:

${result.status}

  <br>

  Rows Processed:
  ${result.rows_processed}

  <br>

  Rows Failed:
  ${result.rows_failed}

  <br>

Last Updated:

${new Date()
  .toLocaleTimeString()}

</div>

<br>

<div class="status">

  <strong>
    Validation Errors
  </strong>

  <br><br>

  <table
    style="
      width:100%;
      border-collapse:collapse;
    "
  >

    <thead>

      <tr>

        <th>
          Row
        </th>

        <th>
          Error
        </th>

      </tr>

    </thead>

    <tbody>

      ${errorHtml}

    </tbody>

  </table>

</div>
        `;

    }

  </script>

</body>

</html>
